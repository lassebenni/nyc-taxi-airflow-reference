name: DAG integrity

on:
  pull_request:
  push:
    branches: [main]

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Airflow + requirements
        run: |
          python -m pip install --upgrade pip
          # Airflow 3 to match the class VM (apache/airflow:3.2.0). The DAGs use
          # airflow.sdk + airflow.providers.standard, which do not exist in
          # Airflow 2.x. Bump in lockstep with datatrack/bicep/modules/vm-airflow.bicep.
          pip install "apache-airflow==3.0.*"
          # providers.standard (BashOperator/EmptyOperator) is bundled in the Astro
          # image but must be installed explicitly for a plain pip CI.
          pip install apache-airflow-providers-standard
          pip install -r requirements.txt
          pip install pytest

      - name: Run DAG integrity tests
        env:
          AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"
          AIRFLOW__CORE__LOAD_EXAMPLES: "False"
        run: pytest tests/test_dag_integrity.py -v
